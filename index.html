<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="shortcut icon"
      href="images/gallery-icon.png"
      type="image/x-icon"
    />
    <script src="./app.js" defer></script>
    <title>Image Gallery</title>
  </head>
  <body>
    <section
      tabindex="0"
      role="region"
      aria-label="album of images"
      id="albumDisplay"
    ></section>
    <section tabindex="0" id="mainDisplay" aria-label="main displayed image">
      <img
        class="holding"
        src="./images/holding.jpg"
        alt="holding image, please select image from album"
      />
    </section>
    <footer>
      <nav>
        <select id="darkMode" name="dark/light">
          <option>Light Mode</option>
          <option>Dark Mode</option>
        </select>
      </nav>
    </footer>
  </body>
</html>
